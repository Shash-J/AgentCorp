name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run check

      - name: Build dist package
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Validate default org.toml configuration
        run: node dist/cli.js validate --config org.toml

      - name: Validate examples/org.toml configuration
        run: node dist/cli.js validate --config examples/org.toml

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify npm packaging dry run
        run: npm pack --dry-run --ignore-scripts

      - name: Verify system doctor diagnostics
        run: node dist/cli.js doctor --config org.toml
